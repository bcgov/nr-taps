apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    required: true
  - name: ZONE
    required: true
  - name: IMAGE_TAG
    required: true
  - name: OIDC_ISSUER_URI
    required: true
  - name: OIDC_CLIENT_ID
    required: true
objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${NAME}-${ZONE}-backend
      labels:
        app: ${NAME}-${ZONE}
    spec:
      replicas: 1
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-backend
      template:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            deployment: ${NAME}-${ZONE}-backend
        spec:
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 90
          containers:
            - name: backend
              image: ghcr.io/bcgov/${NAME}/backend:${IMAGE_TAG}
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 8080
              env:
                - name: TZ
                  value: America/Vancouver
                - name: TAPS_OIDC_ISSUER_URI
                  value: ${OIDC_ISSUER_URI}
                - name: TAPS_OIDC_CLIENT_ID
                  value: ${OIDC_CLIENT_ID}
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 768Mi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              # Allow Service endpoint removal before Spring starts graceful shutdown.
              lifecycle:
                preStop:
                  exec:
                    command: [sleep, '10']
              startupProbe:
                httpGet:
                  path: /actuator/health/liveness
                  port: http
                periodSeconds: 5
                failureThreshold: 30
              readinessProbe:
                httpGet:
                  path: /actuator/health/readiness
                  port: http
                periodSeconds: 5
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /actuator/health/liveness
                  port: http
                periodSeconds: 10
                failureThreshold: 3
          volumes:
            - name: tmp
              emptyDir: {}
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${NAME}-${ZONE}-backend
      labels:
        app: ${NAME}-${ZONE}
    spec:
      selector:
        deployment: ${NAME}-${ZONE}-backend
      ports:
        - name: http
          port: 8080
          targetPort: http
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-${ZONE}-backend-ingress
      labels:
        app: ${NAME}-${ZONE}
    spec:
      podSelector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-backend
      policyTypes: [Ingress]
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  deployment: ${NAME}-${ZONE}-frontend
          ports:
            - protocol: TCP
              port: 8080
