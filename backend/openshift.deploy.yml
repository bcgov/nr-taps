---
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: nr-taps-backend-deploy
parameters:
  - name: NAME
    description: App name prefix
    value: nr-taps
  - name: ZONE
    description: PR number, 'test' or 'prod'
    required: true
  - name: IMAGE_REF
    description: Full image reference; TEST and PROD require a SHA-256 digest
    required: true
  - name: ROLLOUT_TRIGGER
    description: Value placed on the pod template to force a rollout when a reused image tag is rebuilt
    value: ""
  - name: SPRING_PROFILES_ACTIVE
    description: Oracle is enabled for every deployed backend
    value: oracle
  - name: MIN_REPLICAS
    value: "1"
  - name: MAX_REPLICAS
    value: "1"
  - name: MIN_CPU
    value: "200m"
  - name: MIN_MEM
    value: "500Mi"
  - name: MAX_CPU
    value: "1000m"
  - name: MAX_MEM
    value: "800Mi"
  - name: TZ
    value: America/Vancouver
  - name: APP_LOG_LEVEL
    value: INFO
  - name: TAPS_FAILURE_DIAGNOSTICS_LOG_LEVEL
    description: DEBUG logs database error codes for failed reads; INFO keeps them off
    value: INFO
  - name: SPRING_SECURITY_LOG_LEVEL
    value: INFO
  - name: SPRING_WEB_LOG_LEVEL
    value: INFO
  - name: SPRING_BOOT_AUTOCONFIG_LOG_LEVEL
    value: INFO
  - name: TAPS_OIDC_ISSUER_URI
    description: BC Gov SSO issuer for interactive users
    required: true
  - name: TAPS_OIDC_CLIENT_ID
    description: Public browser client ID expected in access tokens
    required: true
  # Every deployed backend requires its environment's database settings.
  - name: DATABASE_MAX_POOL_SIZE
    value: "2"
  - name: DATABASE_MIN_IDLE
    value: "0"
  - name: DATABASE_CONNECTION_TIMEOUT_MS
    value: "3000"
  - name: DATABASE_QUERY_TIMEOUT_SECONDS
    value: "20"
  - name: DATABASE_CONNECT_TIMEOUT_MS
    value: "10000"
  - name: DATABASE_READ_TIMEOUT_MS
    value: "30000"
  - name: DATABASE_HOST
    required: true
  - name: DATABASE_PORT
    description: Oracle TCPS listener port
    value: "1543"
  - name: DATABASE_SERVICE_NAME
    required: true
  - name: DATABASE_USER
    required: true
  - name: DATABASE_PASSWORD
    required: true
  - name: KEYSTORE_SECRET
    description: Passphrase for the truststore generated from the database certificate
    required: true

objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${NAME}-backend-${ZONE}
      labels:
        app: ${NAME}-backend-${ZONE}
        app.kubernetes.io/name: ${NAME}-backend
        app.kubernetes.io/instance: ${ZONE}
    spec:
      replicas: ${{MIN_REPLICAS}}
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
      selector:
        matchLabels:
          app: ${NAME}-backend-${ZONE}
      template:
        metadata:
          labels:
            app: ${NAME}-backend-${ZONE}
            app.kubernetes.io/name: ${NAME}-backend
            app.kubernetes.io/instance: ${ZONE}
          annotations:
            app.openshift.io/redeploy-token: ${ROLLOUT_TRIGGER}
        spec:
          terminationGracePeriodSeconds: 90
          automountServiceAccountToken: false
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app: ${NAME}-backend-${ZONE}
          securityContext:
            runAsNonRoot: true
          initContainers:
            # Writes /cert/jssecacerts from the database server's certificate on every pod start.
            - name: ${NAME}-backend-init
              image: ghcr.io/bcgov/nr-forest-client/common:prod
              imagePullPolicy: Always
              env:
                - name: ORACLEDB_HOST
                  value: ${DATABASE_HOST}
                - name: ORACLEDB_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-backend-secret-${ZONE}
                      key: KEYSTORE_SECRET
                - name: ORACLEDB_PORT
                  value: ${DATABASE_PORT}
              volumeMounts:
                - name: api-cert
                  mountPath: /cert
                - name: init-tmp-storage
                  mountPath: /tmp
              resources:
                requests:
                  cpu: "200m"
                  memory: "300Mi"
                  ephemeral-storage: "50Mi"
                limits:
                  cpu: "500m"
                  memory: "500Mi"
                  ephemeral-storage: "100Mi"
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
          containers:
            - name: ${NAME}-backend
              image: ${IMAGE_REF}
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 8080
                  protocol: TCP
              env:
                - name: TZ
                  value: ${TZ}
                - name: SPRING_PROFILES_ACTIVE
                  value: ${SPRING_PROFILES_ACTIVE}
                - name: SERVER_PORT
                  value: "8080"
                - name: HOME
                  value: /tmp
                - name: TAPS_IMAGE_REFERENCE
                  value: ${IMAGE_REF}
                - name: TAPS_OIDC_ISSUER_URI
                  value: ${TAPS_OIDC_ISSUER_URI}
                - name: TAPS_OIDC_CLIENT_ID
                  value: ${TAPS_OIDC_CLIENT_ID}
                - name: DATABASE_MAX_POOL_SIZE
                  value: ${DATABASE_MAX_POOL_SIZE}
                - name: DATABASE_MIN_IDLE
                  value: ${DATABASE_MIN_IDLE}
                - name: DATABASE_CONNECTION_TIMEOUT_MS
                  value: ${DATABASE_CONNECTION_TIMEOUT_MS}
                - name: DATABASE_QUERY_TIMEOUT_SECONDS
                  value: ${DATABASE_QUERY_TIMEOUT_SECONDS}
                - name: DATABASE_CONNECT_TIMEOUT_MS
                  value: ${DATABASE_CONNECT_TIMEOUT_MS}
                - name: DATABASE_READ_TIMEOUT_MS
                  value: ${DATABASE_READ_TIMEOUT_MS}
                - name: DATABASE_HOST
                  value: ${DATABASE_HOST}
                - name: DATABASE_PORT
                  value: ${DATABASE_PORT}
                - name: DATABASE_SERVICE_NAME
                  value: ${DATABASE_SERVICE_NAME}
                - name: DATABASE_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-backend-secret-${ZONE}
                      key: DATABASE_USER
                - name: DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-backend-secret-${ZONE}
                      key: DATABASE_PASSWORD
                - name: KEYSTORE_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-backend-secret-${ZONE}
                      key: KEYSTORE_SECRET
                - name: APP_LOG_LEVEL
                  value: ${APP_LOG_LEVEL}
                - name: TAPS_FAILURE_DIAGNOSTICS_LOG_LEVEL
                  value: ${TAPS_FAILURE_DIAGNOSTICS_LOG_LEVEL}
                - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY
                  value: ${SPRING_SECURITY_LOG_LEVEL}
                - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB
                  value: ${SPRING_WEB_LOG_LEVEL}
                - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT_AUTOCONFIGURE
                  value: ${SPRING_BOOT_AUTOCONFIG_LOG_LEVEL}
              resources:
                requests:
                  cpu: ${MIN_CPU}
                  memory: ${MIN_MEM}
                  ephemeral-storage: "512Mi"
                limits:
                  cpu: ${MAX_CPU}
                  memory: ${MAX_MEM}
                  ephemeral-storage: "4Gi"
              # Keep serving while the Service drops this pod. The sleep counts against
              # terminationGracePeriodSeconds (10s here + 60s shutdown phase < 90s).
              lifecycle:
                preStop:
                  exec:
                    command: ["sleep", "10"]
              startupProbe:
                httpGet:
                  path: /actuator/health/liveness
                  port: http
                periodSeconds: 5
                timeoutSeconds: 3
                failureThreshold: 60
                successThreshold: 1
              livenessProbe:
                httpGet:
                  path: /actuator/health/liveness
                  port: http
                periodSeconds: 15
                timeoutSeconds: 3
                failureThreshold: 3
                successThreshold: 1
              readinessProbe:
                httpGet:
                  path: /actuator/health/readiness
                  port: http
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
                successThreshold: 1
              volumeMounts:
                - name: api-cert
                  mountPath: /cert
                  readOnly: true
                - name: tmp-storage
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
          volumes:
            - name: tmp-storage
              emptyDir: {}
            - name: init-tmp-storage
              emptyDir: {}
            # Per-pod, rebuilt on every start so a rotated certificate is picked up.
            - name: api-cert
              emptyDir: {}

  - apiVersion: v1
    kind: Service
    metadata:
      name: ${NAME}-backend-${ZONE}
      labels:
        app: ${NAME}-backend-${ZONE}
        app.kubernetes.io/name: ${NAME}-backend
        app.kubernetes.io/instance: ${ZONE}
    spec:
      selector:
        app: ${NAME}-backend-${ZONE}
      ports:
        - name: http
          port: 8080
          protocol: TCP
          targetPort: http

  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      name: ${NAME}-backend-${ZONE}-cpu
      labels:
        app: ${NAME}-backend-${ZONE}
        app.kubernetes.io/name: ${NAME}-backend
        app.kubernetes.io/instance: ${ZONE}
    spec:
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: ${NAME}-backend-${ZONE}
      minReplicas: ${{MIN_REPLICAS}}
      maxReplicas: ${{MAX_REPLICAS}}
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 70
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 60
            - type: Pods
              value: 2
              periodSeconds: 60
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 25
              periodSeconds: 60

  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${NAME}-backend-secret-${ZONE}
      labels:
        app: ${NAME}-backend-${ZONE}
        app.kubernetes.io/name: ${NAME}-backend
        app.kubernetes.io/instance: ${ZONE}
    type: Opaque
    stringData:
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      KEYSTORE_SECRET: ${KEYSTORE_SECRET}

  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-backend-${ZONE}-ingress
      labels:
        app: ${NAME}-backend-${ZONE}
        app.kubernetes.io/name: ${NAME}-backend
        app.kubernetes.io/instance: ${ZONE}
    spec:
      podSelector:
        matchLabels:
          app: ${NAME}-backend-${ZONE}
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app: ${NAME}-frontend-${ZONE}
          ports:
            - protocol: TCP
              port: 8080
      policyTypes:
        - Ingress
