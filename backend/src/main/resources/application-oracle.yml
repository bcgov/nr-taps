spring:
  autoconfigure:
    # Re-enable the datasource for the Oracle profile.
    exclude: []

  datasource:
    # Local runs against a plain TCP Oracle can override this with SPRING_DATASOURCE_URL.
    url: "jdbc:oracle:thin:@(DESCRIPTION=(ADDRESS=(PROTOCOL=TCPS)(HOST=${DATABASE_HOST})(PORT=${DATABASE_PORT:1543}))(CONNECT_DATA=(SERVICE_NAME=${DATABASE_SERVICE_NAME})(SERVER=DEDICATED)))"
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      data-source-properties:
        javax.net.ssl.trustStoreType: JKS
        javax.net.ssl.trustStore: ${TRUSTSTORE_PATH:/cert/jssecacerts}
        javax.net.ssl.trustStorePassword: ${KEYSTORE_SECRET}
        # Bound the socket so a stalled database fails a read instead of holding a worker thread.
        oracle.net.CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT_MS:10000}
        oracle.jdbc.ReadTimeout: ${DATABASE_READ_TIMEOUT_MS:30000}
        # The 21.3 driver's default NIO transport ignores ReadTimeout; the classic socket honours it.
        oracle.jdbc.javaNetNio: false

management:
  endpoint:
    health:
      group:
        readiness:
          # A shared database outage shouldn't pull every replica; /actuator/health still reports db.
          include: readinessState
