name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      target:
        required: true
        type: string
      tag:
        required: true
        type: string
    secrets:
      oc_namespace:
        required: true
      oc_token:
        required: true

permissions: {}

jobs:
  validate:
    name: Check deployment settings
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require OpenShift and FAM configuration
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          DEPLOY_TARGET: ${{ inputs.target }}
          OC_SERVER: ${{ vars.oc_server }}
          OC_APPS_DOMAIN: ${{ vars.OC_APPS_DOMAIN }}
          OC_NAMESPACE: ${{ secrets.oc_namespace }}
          OC_TOKEN: ${{ secrets.oc_token }}
          TAPS_OIDC_ISSUER_URI: ${{ vars.TAPS_OIDC_ISSUER_URI }}
          TAPS_OIDC_CLIENT_ID: ${{ vars.TAPS_OIDC_CLIENT_ID }}
        run: |
          if ! { [[ "$DEPLOY_ENV" == dev && "$DEPLOY_TARGET" =~ ^[0-9]+$ ]] || [[ "$DEPLOY_ENV" == test && "$DEPLOY_TARGET" == test ]]; }; then
            echo '::error title=Unsupported deployment target::Only DEV PR previews and TEST are enabled.'
            exit 1
          fi
          for setting in OC_SERVER OC_APPS_DOMAIN OC_NAMESPACE OC_TOKEN TAPS_OIDC_ISSUER_URI TAPS_OIDC_CLIENT_ID; do
            if [ -z "${!setting}" ]; then
              echo "::error title=Missing deployment setting::${setting} is required for the ${{ inputs.environment }} environment."
              exit 1
            fi
          done

  backend:
    name: Deploy backend
    needs: [validate]
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: bcgov/action-deployer-openshift@27a85b7b157bfc9c3c9bf0aca53bcd288d4d2506 # v4.2.1
        with:
          file: backend/openshift.deploy.yml
          lite_mode: false
          overwrite: true
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          parameters: |
            -p NAME="${{ github.event.repository.name }}"
            -p ZONE="${{ inputs.target }}"
            -p IMAGE_TAG="${{ inputs.tag }}"
            -p OIDC_ISSUER_URI="${{ vars.TAPS_OIDC_ISSUER_URI }}"
            -p OIDC_CLIENT_ID="${{ vars.TAPS_OIDC_CLIENT_ID }}"

  frontend:
    name: Deploy frontend and route
    needs: [backend]
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: bcgov/action-deployer-openshift@27a85b7b157bfc9c3c9bf0aca53bcd288d4d2506 # v4.2.1
        with:
          file: frontend/openshift.deploy.yml
          lite_mode: false
          overwrite: true
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          parameters: |
            -p NAME="${{ github.event.repository.name }}"
            -p ZONE="${{ inputs.target }}"
            -p IMAGE_TAG="${{ inputs.tag }}"
            -p OIDC_ISSUER_URI="${{ vars.TAPS_OIDC_ISSUER_URI }}"
            -p OIDC_CLIENT_ID="${{ vars.TAPS_OIDC_CLIENT_ID }}"
      - uses: bcgov/action-deployer-openshift@27a85b7b157bfc9c3c9bf0aca53bcd288d4d2506 # v4.2.1
        with:
          file: frontend/openshift.route.yml
          overwrite: true
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          parameters: |
            -p NAME="${{ github.event.repository.name }}"
            -p ZONE="${{ inputs.target }}"
            -p DOMAIN="${{ vars.OC_APPS_DOMAIN }}"
