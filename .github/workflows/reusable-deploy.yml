name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub/OpenShift environment: dev, test or prod"
        required: true
        type: string
      target:
        description: PR number for dev; test or prod for shared environments
        required: true
        type: string
      tag:
        description: DEV commit SHA image tag
        required: false
        type: string
        default: ""
      backend_image:
        description: TEST/PROD backend image pinned by digest
        type: string
        default: ""
      frontend_image:
        description: TEST/PROD frontend image pinned by digest
        type: string
        default: ""
      source_ref:
        description: Commit whose deployment templates accompany the images
        type: string
        default: ""
    secrets:
      oc_namespace:
        description: OpenShift namespace
        required: true
      oc_token:
        description: OpenShift token
        required: true
      # Read from the selected environment only; callers do not pass database credentials.
      database_host:
        description: Oracle host
        required: false
      port:
        description: Oracle TCPS listener port (defaults to 1543)
        required: false
      database_service_name:
        description: Oracle service name
        required: false
      database_user:
        description: Oracle DATABASE_USER
        required: false
      database_password:
        description: Oracle DATABASE_PASSWORD
        required: false
      keystore_secret:
        description: Oracle keystore passphrase
        required: false
    outputs:
      route_slot:
        description: Public route slot for smoke checks and registered SSO callbacks
        value: ${{ jobs.validate.outputs.route_slot }}

permissions: {}

jobs:
  validate:
    name: Check deployment settings
    permissions:
      contents: read
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      route_slot: ${{ steps.settings.outputs.route_slot }}
      backend_image: ${{ steps.settings.outputs.backend_image }}
      frontend_image: ${{ steps.settings.outputs.frontend_image }}
      source_ref: ${{ steps.settings.outputs.source_ref }}
      backend_min_replicas: ${{ steps.settings.outputs.backend_min_replicas }}
      backend_max_replicas: ${{ steps.settings.outputs.backend_max_replicas }}
      database_max_pool_size: ${{ steps.settings.outputs.database_max_pool_size }}
      database_min_idle: ${{ steps.settings.outputs.database_min_idle }}
      database_connection_timeout_ms: ${{ steps.settings.outputs.database_connection_timeout_ms }}
      database_query_timeout_seconds: ${{ steps.settings.outputs.database_query_timeout_seconds }}
      database_connect_timeout_ms: ${{ steps.settings.outputs.database_connect_timeout_ms }}
      database_read_timeout_ms: ${{ steps.settings.outputs.database_read_timeout_ms }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require OpenShift and FAM configuration
        id: settings
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          DEPLOY_TARGET: ${{ inputs.target }}
          IMAGE_TAG: ${{ inputs.tag }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          FRONTEND_IMAGE: ${{ inputs.frontend_image }}
          SOURCE_REF: ${{ inputs.source_ref }}
          OC_SERVER: ${{ vars.OC_SERVER }}
          OC_APPS_DOMAIN: ${{ vars.OC_APPS_DOMAIN }}
          OC_NAMESPACE: ${{ secrets.oc_namespace }}
          OC_TOKEN: ${{ secrets.oc_token }}
          TAPS_OIDC_ISSUER_URI: ${{ vars.TAPS_OIDC_ISSUER_URI }}
          TAPS_OIDC_CLIENT_ID: ${{ vars.TAPS_OIDC_CLIENT_ID }}
          TAPS_BACKEND_MIN_REPLICAS: ${{ vars.TAPS_BACKEND_MIN_REPLICAS }}
          TAPS_BACKEND_MAX_REPLICAS: ${{ vars.TAPS_BACKEND_MAX_REPLICAS }}
          DATABASE_MAX_POOL_SIZE: ${{ vars.DATABASE_MAX_POOL_SIZE }}
          DATABASE_MIN_IDLE: ${{ vars.DATABASE_MIN_IDLE }}
          DATABASE_CONNECTION_TIMEOUT_MS: ${{ vars.DATABASE_CONNECTION_TIMEOUT_MS }}
          DATABASE_QUERY_TIMEOUT_SECONDS: ${{ vars.DATABASE_QUERY_TIMEOUT_SECONDS }}
          DATABASE_CONNECT_TIMEOUT_MS: ${{ vars.DATABASE_CONNECT_TIMEOUT_MS }}
          DATABASE_READ_TIMEOUT_MS: ${{ vars.DATABASE_READ_TIMEOUT_MS }}
          DATABASE_HOST: ${{ secrets.database_host }}
          DATABASE_PORT: ${{ secrets.port || '1543' }}
          DATABASE_SERVICE_NAME: ${{ secrets.database_service_name }}
          DATABASE_USER: ${{ secrets.database_user }}
          DATABASE_PASSWORD: ${{ secrets.database_password }}
          KEYSTORE_SECRET: ${{ secrets.keystore_secret }}
        run: node .github/scripts/deployment-settings.mjs

  backend:
    name: Deploy backend
    needs: [validate]
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.source_ref }}

      - name: Stage selected backend template
        run: |
          mkdir -p "$RUNNER_TEMP/taps-deploy"
          cp backend/openshift.deploy.yml "$RUNNER_TEMP/taps-deploy/backend.yml"

      - uses: bcgov/action-deployer-openshift@bb9d143f4f03187239580c17c4b77da04cdb6e66 # v4.2.2
        env:
          DATABASE_HOST: ${{ secrets.database_host }}
          DATABASE_PORT: ${{ secrets.port || '1543' }}
          DATABASE_SERVICE_NAME: ${{ secrets.database_service_name }}
          DATABASE_USER: ${{ secrets.database_user }}
          DATABASE_PASSWORD: ${{ secrets.database_password }}
          KEYSTORE_SECRET: ${{ secrets.keystore_secret }}
        with:
          file: ${{ runner.temp }}/taps-deploy/backend.yml
          lite_mode: false
          overwrite: true
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.oc_token }}
          parameters: >-
            -p NAME="${{ github.event.repository.name }}"
            -p ZONE="${{ inputs.target }}"
            -p IMAGE_REF="${{ needs.validate.outputs.backend_image }}"
            -p ROLLOUT_TRIGGER="${{ github.run_id }}-${{ github.run_attempt }}"
            -p SPRING_PROFILES_ACTIVE=oracle
            -p MIN_REPLICAS="${{ needs.validate.outputs.backend_min_replicas }}"
            -p MAX_REPLICAS="${{ needs.validate.outputs.backend_max_replicas }}"
            -p DATABASE_MAX_POOL_SIZE="${{ needs.validate.outputs.database_max_pool_size }}"
            -p DATABASE_MIN_IDLE="${{ needs.validate.outputs.database_min_idle }}"
            -p DATABASE_CONNECTION_TIMEOUT_MS="${{ needs.validate.outputs.database_connection_timeout_ms }}"
            -p DATABASE_QUERY_TIMEOUT_SECONDS="${{ needs.validate.outputs.database_query_timeout_seconds }}"
            -p DATABASE_CONNECT_TIMEOUT_MS="${{ needs.validate.outputs.database_connect_timeout_ms }}"
            -p DATABASE_READ_TIMEOUT_MS="${{ needs.validate.outputs.database_read_timeout_ms }}"
            -p TAPS_FAILURE_DIAGNOSTICS_LOG_LEVEL="${{ (inputs.environment == 'dev' || inputs.environment == 'test') && 'DEBUG' || 'INFO' }}"
            -p TAPS_OIDC_ISSUER_URI="${{ vars.TAPS_OIDC_ISSUER_URI }}"
            -p TAPS_OIDC_CLIENT_ID="${{ vars.TAPS_OIDC_CLIENT_ID }}"
            -p DATABASE_HOST="$DATABASE_HOST"
            -p DATABASE_PORT="$DATABASE_PORT"
            -p DATABASE_SERVICE_NAME="$DATABASE_SERVICE_NAME"
            -p DATABASE_USER="$DATABASE_USER"
            -p DATABASE_PASSWORD="$DATABASE_PASSWORD"
            -p KEYSTORE_SECRET="$KEYSTORE_SECRET"

  frontend:
    name: Deploy frontend and route
    needs: [validate, backend]
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.source_ref }}

      - name: Stage selected frontend templates
        run: |
          mkdir -p "$RUNNER_TEMP/taps-deploy"
          cp frontend/openshift.deploy.yml "$RUNNER_TEMP/taps-deploy/frontend.yml"
          cp frontend/openshift.route.yml "$RUNNER_TEMP/taps-deploy/route.yml"

      - uses: bcgov/action-deployer-openshift@bb9d143f4f03187239580c17c4b77da04cdb6e66 # v4.2.2
        with:
          file: ${{ runner.temp }}/taps-deploy/frontend.yml
          lite_mode: false
          overwrite: true
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.oc_token }}
          parameters: >-
            -p NAME="${{ github.event.repository.name }}"
            -p ZONE="${{ inputs.target }}"
            -p IMAGE_REF="${{ needs.validate.outputs.frontend_image }}"
            -p ROLLOUT_TRIGGER="${{ github.run_id }}-${{ github.run_attempt }}"
            -p VITE_OIDC_ISSUER_URI="${{ vars.TAPS_OIDC_ISSUER_URI }}"
            -p VITE_OIDC_CLIENT_ID="${{ vars.TAPS_OIDC_CLIENT_ID }}"
            -p VITE_OIDC_IDIR_HINT="${{ vars.TAPS_OIDC_IDIR_HINT || 'azureidir' }}"
            -p VITE_OIDC_BCEID_HINT="${{ vars.TAPS_OIDC_BCEID_HINT || 'bceidbusiness' }}"
            -p VITE_OIDC_SITEMINDER_LOGOUT_URL="${{ vars.TAPS_OIDC_SITEMINDER_LOGOUT_URL || (inputs.environment == 'prod' && 'https://logon7.gov.bc.ca/clp-cgi/logoff.cgi' || 'https://logontest7.gov.bc.ca/clp-cgi/logoff.cgi') }}"

      - name: Route
        uses: bcgov/action-deployer-openshift@bb9d143f4f03187239580c17c4b77da04cdb6e66 # v4.2.2
        with:
          file: ${{ runner.temp }}/taps-deploy/route.yml
          overwrite: true
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.oc_token }}
          parameters: >-
            -p NAME="${{ github.event.repository.name }}"
            -p ZONE="${{ inputs.target }}"
            -p SLOT="${{ needs.validate.outputs.route_slot }}"
            -p DOMAIN="${{ vars.OC_APPS_DOMAIN }}"

  deployment-result:
    name: Record deployment result
    needs: [validate, backend, frontend]
    # Only targets that passed validation get a deployment record.
    if: ${{ always() && needs.validate.result == 'success' }}
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-slim
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Fail incomplete deployments
        if: ${{ needs.backend.result != 'success' || needs.frontend.result != 'success' }}
        run: |
          echo "Backend deployment result: ${{ needs.backend.result }}"
          echo "Frontend deployment result: ${{ needs.frontend.result }}"
          exit 1

      - name: Confirm deployment
        run: echo "Backend and frontend deployments succeeded."
