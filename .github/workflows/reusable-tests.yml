name: Reusable Tests

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string

permissions: {}

jobs:
  smoke:
    name: Public route and protected API
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for application
        env:
          BASE_URL: https://${{ github.event.repository.name }}-${{ inputs.target }}.${{ vars.OC_APPS_DOMAIN }}
        run: |
          for attempt in {1..30}; do
            page_status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$BASE_URL/" || true)
            api_status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$BASE_URL/api/me" || true)
            config_status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$BASE_URL/config.js" || true)
            if [ "$page_status" = 200 ] && [ "$api_status" = 401 ] && [ "$config_status" = 200 ]; then
              exit 0
            fi
            echo "Waiting for route (page=$page_status api=$api_status config=$config_status, attempt $attempt/30)"
            sleep 10
          done
          exit 1
