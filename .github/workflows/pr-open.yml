name: PR

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: pr-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  builds:
    name: Build (${{ matrix.package }})
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: write
      id-token: write
      packages: write
    strategy:
      matrix:
        package: [backend, frontend]
    steps:
      - uses: bcgov/action-builder-ghcr@cb2629351c87dd1c2130073e4ebb7233a9653a63 # v4.4.1
        with:
          package: ${{ matrix.package }}
          tags: |
            ${{ github.event.number }}
            ${{ github.event.pull_request.head.sha }}

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 21.0.12 (Temurin) + Maven cache
        uses: actions/setup-java@v5
        with:
          java-version: "21.0.12"
          distribution: "temurin"
          cache: maven

      - name: Maven verify
        working-directory: backend
        run: mvn -B -DskipITs verify

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend quality checks
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint
          npm run format:check

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:cov

  deploy:
    name: DEV Preview
    needs: [builds, backend-tests, frontend-tests]
    if: needs.builds.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      oc_namespace: ${{ secrets.oc_namespace }}
      oc_token: ${{ secrets.oc_token }}
    with:
      environment: dev
      target: ${{ github.event.number }}
      tag: ${{ github.event.pull_request.head.sha }}

  smoke:
    name: DEV Smoke
    needs: [deploy]
    if: needs.deploy.result == 'success'
    uses: ./.github/workflows/reusable-tests.yml
    with:
      target: ${{ needs.deploy.outputs.route_slot }}
      tag: ${{ github.event.pull_request.head.sha }}

  results:
    name: PR Results
    needs: [builds, backend-tests, frontend-tests, deploy, smoke]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: echo "At least one job has failed." && exit 1
      - run: echo "Success!"
