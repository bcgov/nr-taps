name: Merge

on:
  push:
    branches: [main]

concurrency:
  group: merge
  cancel-in-progress: false

permissions: {}

jobs:
  init:
    name: Find merged PR image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    steps:
      - id: pr
        uses: bcgov/action-get-pr@28b0adf8e4d40720d41f9c87356ce24b0a4bd6af # v0.3.1
      - name: Require PR image
        env:
          PR: ${{ steps.pr.outputs.pr }}
        run: test -n "$PR"

  deploy-test:
    name: TEST Deploy
    needs: [init]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      oc_namespace: ${{ secrets.oc_namespace }}
      oc_token: ${{ secrets.oc_token }}
    with:
      environment: test
      target: test
      tag: ${{ needs.init.outputs.pr }}

  smoke:
    name: TEST Smoke
    needs: [deploy-test]
    uses: ./.github/workflows/reusable-tests.yml
    with:
      target: test

  promote-test:
    name: Tag TEST Images
    needs: [init, smoke]
    runs-on: ubuntu-slim
    permissions:
      packages: write
    strategy:
      matrix:
        package: [backend, frontend]
    steps:
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ needs.init.outputs.pr }}
          tags: test

  # PROD remains disabled. Add a separate, reviewed promotion workflow only after
  # its dedicated hostname, certificate, FAM client and acceptance are ready.
