name: Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".github/graphics/**"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  # TEST deploys the merged PR's images, so update a PR from main before merging.
  init:
    name: Find merged PR image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
      capture_attempt: ${{ steps.images.outputs.capture_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: pr
        uses: bcgov/action-get-pr@28b0adf8e4d40720d41f9c87356ce24b0a4bd6af # v0.3.1
      - name: Require PR image
        env:
          PR: ${{ steps.pr.outputs.pr }}
        run: test -n "$PR"
      - name: Capture synchronized PR image digests
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr }}
        run: node .github/scripts/release-images.mjs capture

  deploy-test:
    name: TEST Deploy
    needs: [init]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      oc_namespace: ${{ secrets.oc_namespace }}
      oc_token: ${{ secrets.oc_token }}
    with:
      environment: test
      target: test
      source_ref: ${{ github.sha }}
      backend_image: ${{ needs.init.outputs.backend_image }}
      frontend_image: ${{ needs.init.outputs.frontend_image }}

  smoke:
    name: TEST Smoke
    needs: [init, deploy-test]
    uses: ./.github/workflows/reusable-tests.yml
    with:
      target: test
      backend_image: ${{ needs.init.outputs.backend_image }}
      frontend_image: ${{ needs.init.outputs.frontend_image }}

  release-candidate:
    name: Record TEST-verified release candidate
    needs: [init, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Record tested images
        env:
          CAPTURE_ATTEMPT: ${{ needs.init.outputs.capture_attempt }}
          BACKEND_IMAGE: ${{ needs.init.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.init.outputs.frontend_image }}
        run: node .github/scripts/release-images.mjs record "$RUNNER_TEMP/release-candidate.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-candidate.json
          retention-days: 90
          if-no-files-found: error

  # PROD is reachable only through the manual Release PROD workflow.
