apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    required: true
  - name: ZONE
    required: true
  - name: IMAGE_TAG
    description: PR number or commit SHA image tag
    required: true
  - name: OIDC_ISSUER_URI
    required: true
  - name: OIDC_CLIENT_ID
    required: true
  - name: OIDC_SITEMINDER_LOGOUT_URL
    description: SiteMinder logoff.cgi chained before Keycloak logout so Business BCeID sign out ends the upstream session
    required: true
objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${NAME}-${ZONE}-frontend
      labels:
        app: ${NAME}-${ZONE}
    spec:
      replicas: 1
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-frontend
      template:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            deployment: ${NAME}-${ZONE}-frontend
        spec:
          automountServiceAccountToken: false
          initContainers:
            - name: seed-static-files
              image: ghcr.io/bcgov/${NAME}/frontend:${IMAGE_TAG}
              command: [sh, -c, 'cp -r /srv/. /srv-rw/']
              volumeMounts:
                - name: static-files
                  mountPath: /srv-rw
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
                seccompProfile:
                  type: RuntimeDefault
          containers:
            - name: frontend
              image: ghcr.io/bcgov/${NAME}/frontend:${IMAGE_TAG}
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 3000
                - name: health
                  containerPort: 3001
              env:
                - name: LOG_LEVEL
                  value: INFO
                - name: BACKEND_URL
                  value: http://${NAME}-${ZONE}-backend:8080
                - name: TAPS_IMAGE_REFERENCE
                  value: ghcr.io/bcgov/${NAME}/frontend:${IMAGE_TAG}
                - name: VITE_OIDC_ISSUER_URI
                  value: ${OIDC_ISSUER_URI}
                - name: VITE_OIDC_CLIENT_ID
                  value: ${OIDC_CLIENT_ID}
                - name: VITE_OIDC_SITEMINDER_LOGOUT_URL
                  value: ${OIDC_SITEMINDER_LOGOUT_URL}
                - name: XDG_CONFIG_HOME
                  value: /tmp/caddy
                - name: XDG_DATA_HOME
                  value: /tmp/caddy
                - name: TMPDIR
                  value: /tmp/caddy
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: static-files
                  mountPath: /srv
                - name: caddy-data
                  mountPath: /tmp/caddy
                - name: coraza-tmp
                  mountPath: /tmp/coraza
              startupProbe:
                httpGet:
                  path: /health
                  port: health
                periodSeconds: 5
                failureThreshold: 30
              readinessProbe:
                httpGet:
                  path: /health
                  port: health
                periodSeconds: 5
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /health
                  port: health
                periodSeconds: 10
                failureThreshold: 3
          volumes:
            - name: static-files
              emptyDir: {}
            - name: caddy-data
              emptyDir: {}
            - name: coraza-tmp
              emptyDir: {}
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${NAME}-${ZONE}-frontend
      labels:
        app: ${NAME}-${ZONE}
    spec:
      selector:
        deployment: ${NAME}-${ZONE}-frontend
      ports:
        - name: http
          port: 3000
          targetPort: http
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-${ZONE}-frontend-ingress
      labels:
        app: ${NAME}-${ZONE}
    spec:
      podSelector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-frontend
      policyTypes: [Ingress]
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  network.openshift.io/policy-group: ingress
          ports:
            - protocol: TCP
              port: 3000
