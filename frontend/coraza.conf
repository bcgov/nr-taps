SecRuleEngine On

# Requests: 22 MiB; non-file bodies: 512 KiB.
SecRequestBodyAccess On
SecRequestBodyLimit 23068672
SecRequestBodyNoFilesLimit 524288

SecResponseBodyAccess Off

SecTmpDir /tmp/coraza/
SecDataDir /tmp/coraza/

SecAuditEngine RelevantOnly
# Native AKZ omits headers, bodies and URIs; JSON logs may include OAuth URLs.
# Keep matched-rule messages static, without logdata.
SecAuditLogParts AKZ
SecAuditLogFormat Native
SecAuditLogType Serial
SecAuditLog /dev/stdout

SecDebugLog /dev/stdout
SecDebugLogLevel 0

# Exclude opaque credentials from generic attack matching.
SecRule REQUEST_HEADERS|!REQUEST_HEADERS:Authorization|!REQUEST_HEADERS:Cookie|!REQUEST_HEADERS:X-XSRF-TOKEN|ARGS|ARGS_NAMES "@detectSQLi" \
    "id:1001,phase:2,deny,status:403,log,msg:'SQL Injection Attack Detected'"

SecRule REQUEST_HEADERS|!REQUEST_HEADERS:Authorization|!REQUEST_HEADERS:Cookie|!REQUEST_HEADERS:X-XSRF-TOKEN|ARGS|ARGS_NAMES "@detectXSS" \
    "id:1002,phase:2,deny,status:403,log,msg:'XSS Attack Detected'"

# Allow Burp Suite for authorized testing.
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)\b(nikto|sqlmap|nmap|masscan|nessus|openvas|acunetix)\b" \
    "id:1003,phase:1,deny,log,msg:'Known Security Scanner Detected',status:403"

# Keep application routes out of the sensitive-path blocklist.
SecRule REQUEST_URI "@rx ^/(config|backup|tmp|logs|wp-admin|\.env|\.git|\.htaccess|\.htpasswd|\.ssh|\.aws|web\.config)(/|$)" \
    "id:1004,phase:1,deny,log,msg:'Access to sensitive path blocked',status:403"

SecRule ARGS "@rx (?i)(union\s+select|insert\s+into|delete\s+from|drop\s+table|update\s+set|exec\s*\(|execute\s*\(|\bsp_|\bxp_|--(\s|$)|/\*[^*]*\*+/)" \
    "id:1005,phase:2,deny,log,msg:'SQL Injection Pattern Detected',status:403"

SecRule REQUEST_URI|ARGS "@rx (?i)(\.\.(/|\\|%2f|%5c)|(%2e%2e|%252e%252e)(/|\\|%2f|%5c))" \
    "id:1007,phase:2,deny,log,msg:'Path Traversal Attempt Detected',status:403"

SecRule REQUEST_URI|ARGS|REQUEST_HEADERS|!REQUEST_HEADERS:Authorization|!REQUEST_HEADERS:Cookie|!REQUEST_HEADERS:X-XSRF-TOKEN "@rx \x00" \
    "id:1008,phase:2,deny,log,msg:'Null Byte Injection Detected',status:403"
