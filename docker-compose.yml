services:
  backend:
    build: ./backend
    environment:
      TAPS_OIDC_ISSUER_URI: ${TAPS_OIDC_ISSUER_URI}
      TAPS_OIDC_CLIENT_ID: ${TAPS_OIDC_CLIENT_ID}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
      VITE_OIDC_ISSUER_URI: ${TAPS_OIDC_ISSUER_URI}
      VITE_OIDC_CLIENT_ID: ${TAPS_OIDC_CLIENT_ID}
      LOG_LEVEL: INFO
    ports:
      - "3000:3000"
    depends_on:
      - backend
